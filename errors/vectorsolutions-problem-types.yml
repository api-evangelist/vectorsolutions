  detail: The request did not contain valid json.
  remediation: Verify JSON formatting in the request body.
- code: 705
  title: DUPLICATE
  detail: Duplicate data has been sent.
  remediation: Remove duplicate entries before resubmitting.
- code: 800
  title: ACCESS DENIED
  detail: A request was made to a resource that you do not have ownership of.
  remediation: Verify resource ownership permissions.
- code: 801
  title: ACCESS DENIED
  detail: Access Token not passed.
  remediation: Include the AccessToken header in the request.
- code: 802
  title: ACCESS DENIED
  detail: Invalid Access Token.
  remediation: Obtain and use a valid token from your account manager.
- code: 900
  title: NOT IMPLEMENTED
  detail: The requested resource not implemented.
- code: 901
  title: OK
  detail: The request returned zero results.
- code: 902
  title: INVALID JSON
  detail: The search string does not contain valid json.
  remediation: Correct the JSON formatting of the q search parameter.
- code: 903
  title: INVALID SEARCH PARAMS
  detail: The search parameters are invalid.
- code: 904
  title: NOT SEARCHABLE
  detail: The request does not allow passing searchable parameters.
  remediation: Remove search parameters from this endpoint.
- code: 1000
  title: INVALID ARGUMENTS
  detail: The request did not contain required parameters to complete.
- code: 1001
  title: INVALID ARGUMENTS
  detail: The request contained parameters that did not pass validation.
- code: 1002
  title: CONFLICT
  detail: The request not created because it is not unique.
- code: 1003
  title: NOT MODIFIED
  detail: The resource not modified.
- code: 1004
  title: DEPENDENCY
  detail: The resource has dependencies that need to be removed first.
  remediation: Remove dependent resources before deletion.
- code: 1005
  title: BADREQUEST
  detail: The request did not contain any valid parameters to fulfill the request.
- code: 1006
  title: EXTERNAL DEPENDENCY
  detail: The request could not be completed currently due to an external system being unavailable.
  remediation: Retry the request when the external system is accessible.
