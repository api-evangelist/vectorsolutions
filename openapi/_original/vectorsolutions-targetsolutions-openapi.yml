openapi: 3.0.3
info:
  title: TargetSolutions API
  version: v1
  description: REST API for the TargetSolutions online training and records-management platform by Vector Solutions.
    Manage sites, users, profile categories and groups, supervisor and feature access, credentials and credential
    assignments, courses, and training assignments. Authentication uses a customer-specific API token passed in
    the AccessToken header of every request; tokens are issued by a TargetSolutions account manager and can be scoped
    read-only or feature-specific. Responses are JSON. Generated by API Evangelist from the routes, getting-started,
    HTTP status code, and error code documentation at https://developers.targetsolutions.com/ - payload schemas
    are not published by the provider and are left untyped.
  contact:
    name: TargetSolutions Developer Portal
    url: https://developers.targetsolutions.com/
  x-provenance:
    generated: '2026-07-21'
    method: generated
    source: https://developers.targetsolutions.com/documentation/routes
servers:
- url: https://api.targetsolutions.com/v1
  description: Production
- url: https://devsandbox.targetsolutions.com/v1
  description: Developer sandbox (refreshed nightly with a copy of live data)
