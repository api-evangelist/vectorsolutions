aid: vectorsolutions
name: Vector Solutions
description: 'Vector Solutions is a training and workforce management software company
  serving education, public safety, government, manufacturing, construction, and gaming
  industries with products including Vector LMS, Vector EHS, Vector Scheduling, Vector
  Check It, Acadis, Guardian Tracking, and TargetSolutions. Its TargetSolutions platform
  for online training and records management exposes a REST API (v1) for managing sites,
  users, profile groups, supervisor and feature access, credentials, courses, and
  training assignments, documented at developers.targetsolutions.com.'
